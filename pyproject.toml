[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agilecode"
version = "0.1.0"
description = "A headless-first, ticket-driven local coding-agent workbench"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "regex>=2024.11", "PyYAML>=6,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7", "Pygments>=2.18,<3"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
manual = ["reportlab>=4", "Pygments>=2.18,<3"]

[project.scripts]
agilecode = "agilecode.cli:main"
agilecode-gui = "agilecode.desktop.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agilecode = ["desktop/qml/*.qml", "resources/skills/*/SKILL.md", "resources/pm_profiles/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
