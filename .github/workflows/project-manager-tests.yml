name: Project Manager verification
on:
  push:
    branches: [work/project-manager]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply integration edits when present
        run: |
          if [ -f .pm-apply.py ]; then python .pm-apply.py; fi
      - name: Install test dependencies
        run: python -m pip install -e '.[test,desktop]'
      - name: Test
        run: python -m pytest -q
      - name: Commit verified integration edits
        run: |
          if [ -f .pm-apply.py ]; then
            git rm .pm-apply.py
            git config user.name 'AgileCode implementation'
            git config user.email 'actions@users.noreply.github.com'
            git add src tests docs
            git commit -m 'Connect and verify persistent Project Manager'
            git push origin HEAD:work/project-manager
          fi
